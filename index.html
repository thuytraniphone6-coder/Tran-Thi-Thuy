<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Profile - Trần Thị Thuỳ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff9a9e;
        }

        h1 {
            margin: 15px 0 5px;
            color: #333;
        }

        p {
            color: #555;
        }

        .section {
            margin-top: 25px;
            text-align: left;
        }

        .section h2 {
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
            color: #ff758c;
        }

        .info {
            font-size: 16px;
            margin-top: 10px;
        }

        .tag {
            display: inline-block;
            background: #ff758c;
            color: white;
            padding: 6px 12px;
            margin: 5px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://i.imgur.com/placeholder.png" alt="Avatar">
    
    <h1>Trần Thị Thuỳ</h1>
    <p>Lớp: 12C1</p>

    <div class="section">
        <h2>Định hướng tương lai</h2>
        <p>Ngành: Quản trị kinh doanh</p>
        <p>Trường mong muốn: UEL</p>
    </div>

    <div class="section">
        <h2>Sở thích</h2>
        <div class="tag">Xem phim</div>
        <div class="tag">Nghe nhạc</div>
        <div class="tag">Du lịch</div>
    </div>

    <div class="section">
        <h2>Kỹ năng</h2>
        <div class="tag">Chỉnh sửa ảnh</div>
    </div>

</div>

</body>
</html>
