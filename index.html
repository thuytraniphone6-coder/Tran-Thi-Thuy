<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Profile của tôi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #74ebd5;
        }

        h1 {
            margin: 15px 0 5px;
        }

        p {
            color: #555;
        }

        .social a {
            text-decoration: none;
            margin: 10px;
            color: white;
            background: #6a11cb;
            padding: 10px 15px;
            border-radius: 8px;
            display: inline-block;
            transition: 0.3s;
        }

        .social a:hover {
            background: #2575fc;
        }

        .section {
            margin-top: 25px;
            text-align: left;
        }

        .section h2 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="avatar.jpg" alt="Avatar">
    <h1>Tên của bạn</h1>
    <p>Học sinh | Sở thích: nghe nhạc, chụp ảnh</p>

    <div class="social">
        <a href="#">Facebook</a>
        <a href="#">Instagram</a>
        <a href="#">TikTok</a>
    </div>

    <div class="section">
        <h2>Giới thiệu</h2>
        <p>Mình là một người thích sáng tạo, yêu công nghệ và đang học cách làm web.</p>
    </div>

    <div class="section">
        <h2>Kỹ năng</h2>
        <p>HTML, CSS cơ bản, chỉnh sửa ảnh</p>
    </div>

    <div class="section">
        <h2>Liên hệ</h2>
        <p>Email: example@gmail.com</p>
    </div>
</div>

</body>
</html>
